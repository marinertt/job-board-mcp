[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-board-mcp"
version = "0.1.0"
description = "Portable MCP server and client for job discovery, availability verification and audit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.29,<2", "httpx>=0.28,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
quality = [
    "bandit>=1.8,<2",
    "pip-audit>=2.7,<3",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["job_board_mcp*"]

[tool.setuptools.package-data]
job_board_mcp = ["data/*.json", "data/*.md", "data/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
