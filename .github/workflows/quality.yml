name: Free quality and security checks

on:
  push:
  pull_request:
  schedule:
    - cron: "31 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and free check tools
        run: python -m pip install -e ".[quality]"
      - name: Lint Python
        run: ruff check .
      - name: Check Python formatting
        run: ruff format --check .
      - name: Scan source for common security issues
        run: bandit --quiet --recursive job_board_mcp
      - name: Audit installed dependencies
        run: pip-audit --local --skip-editable
